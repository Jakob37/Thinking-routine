<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Thinking Routine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Folder browser">
        <div class="sidebar-header">
          <p class="eyebrow">Thinking Routine</p>
          <div class="sidebar-actions">
            <button id="refresh-folder" type="button" disabled>Refresh</button>
            <button id="choose-folder" type="button">Open folder</button>
          </div>
        </div>
        <p id="folder-name" class="folder-name">No folder selected</p>
        <nav class="app-navigation" aria-label="App pages">
          <button id="landing-page" class="page-button" type="button" disabled>Landing</button>
          <button id="pomodoro-page" class="page-button" type="button">Pomodoro</button>
        </nav>
        <div id="tree" class="tree" role="tree" aria-label="Folder tree">
          <p class="tree-empty">Choose a folder to see its documents.</p>
        </div>
      </aside>
      <main class="document-viewer">
        <div class="document-header">
          <p id="document-path" class="document-path">Document viewer</p>
          <button id="set-landing" type="button" disabled>Set as landing</button>
        </div>
        <div id="document-content" class="document-content" tabindex="0">
          <div class="empty-state">
            <h1>Your documents, in one place.</h1>
            <p>Choose a folder, then select a text document from the sidebar.</p>
          </div>
        </div>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
